apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chpassword
  namespace: chpassword
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: chpass.inf.uct.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
  tls:
    - hosts:
        - chpass.inf.uct.cl
      secretName: chpassword-tls
