apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chpassword
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 0mellado/chpassword-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "http://api.chpassword.svc.cluster.local:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chpassword
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
